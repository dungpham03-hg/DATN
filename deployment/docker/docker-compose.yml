version: "3.8"

services:
  # MongoDB Atlas: không chạy container Mongo nội bộ
  # (Xóa/disable service mongodb vì dùng Atlas)

  # Backend API Server
  server:
    build:
      context: ../../server
      dockerfile: Dockerfile
    container_name: datn-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      NODE_OPTIONS: "--max-old-space-size=512"
      # Database
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      UPLOAD_PATH: uploads
      # Frontend URL for CORS
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DOMAIN_URL: ${DOMAIN_URL:-}
      # Email configuration
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      # OAuth configuration
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
    ports:
      - "5000:5000"
    volumes:
      - server_uploads:/app/uploads
    networks:
      - datn-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Frontend React App
  client:
    build:
      context: ../../client
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-http://localhost:5000/api}
    container_name: datn-client
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - datn-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mongodb_data:
  server_uploads:

networks:
  datn-network:
    driver: bridge
